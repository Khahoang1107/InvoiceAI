version: '3.8'

services:
  # Backend API Service (uses Railway Cloud PostgreSQL)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:your-password@your-host:5432/railway
      - SECRET_KEY=dev-secret-key
      - JWT_SECRET_KEY=jwt-secret-key
      - GROQ_API_KEY=your-groq-api-key-here
      - PINECONE_API_KEY=
      - GOOGLE_AI_API_KEY=your-google-ai-api-key-here
      - PORT=8000
      - ENVIRONMENT=production
      - DEBUG=false
    ports:
      - "8000:8000"
    networks:
      - invoice_network
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads

  # Frontend Service (React + Vite with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - invoice_network
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://backend:8000

networks:
  invoice_network:
    driver: bridge

volumes:
  backend_uploads: